name: Publish

# Publishes to npm whenever the version in package.json on main is one that
# isn't on the registry yet. To release: bump "version", push to main.
#
# Auth is npm trusted publishing (OIDC) — there is no NPM_TOKEN secret. The
# package's trusted publisher on npmjs.com must point at this repo and this
# workflow filename (publish.yml); renaming the file breaks publishing.

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for the OIDC exchange with npm

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing requires a GitHub-hosted runner
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs npm >= 11.5.1, which ships with Node 24.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check whether this version is already published
        id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          published=$(npm view "$name@$version" version 2>/dev/null || true)
          if [ "$published" = "$version" ]; then
            echo "$name@$version is already on npm, nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $name@$version"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.publish == 'true'
        run: npm ci

      # prepublishOnly runs typecheck, tests and the build before the upload.
      - if: steps.check.outputs.publish == 'true'
        run: npm publish
